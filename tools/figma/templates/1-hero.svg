  <text id="note" x="80" y="164" font-family="IBM Plex Mono, Roboto Mono, monospace" font-size="22" fill="#4E6B78">Картинку — в заливку серого слота (Fill → Image). Имя слота не менять. Экспорт: JPG, 1x.</text>
