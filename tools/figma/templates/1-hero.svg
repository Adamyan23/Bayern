    <text id="hint hero" x="80" y="270" font-family="IBM Plex Mono, Roboto Mono, monospace" font-size="20" fill="#4E6B78">Кадр средней/тёмной тональности. Пунктир — логотип, текст, видимая часть на ноутбуке и на телефоне.</text>
